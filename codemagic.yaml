workflows:
  android-build:
    name: Android Build Cordova
    max_build_duration: 60

    environment:
      node: 18

    scripts:
      - name: Install Cordova globally
        script: npm install -g cordova

      - name: Install project dependencies
        script: npm install

      - name: Clean previous platforms
        script: cordova platform rm android || true

      - name: Add Android platform
        script: cordova platform add android

      - name: Build Android APK
        script: cordova build android

    artifacts:
      - platforms/android/app/build/outputs/apk/**/*.apk
      - platforms/android/**/outputs/**/*.apk
