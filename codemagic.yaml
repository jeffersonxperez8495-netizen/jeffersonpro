workflows:
  android-build:
    name: Android Build Cordova

    environment:
      node: 18
      java: 17

    scripts:
      - name: Install Cordova globally
        script: npm install -g cordova

      - name: Install project dependencies
        script: npm install

      - name: Clean previous platforms
        script: cordova platform rm android || true

      - name: Install Android SDK 34
        script: |
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Add Android platform
        script: cordova platform add android@12

      - name: Build Android APK
        script: cordova build android

    artifacts:
      - platforms/android/app/build/outputs/**/*.apk
